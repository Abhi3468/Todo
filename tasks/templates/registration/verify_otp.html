{% extends 'registration/base.html' %}
{% block title %}Verify Code · FocusList{% endblock %}

{% block content %}
<script>
    let isSubmitting = false;
    window.history.pushState(null, null, window.location.href);
    window.onpopstate = function () {
        if (confirm("If you go back, your verification will be cancelled. Do you want to continue?")) {
             window.location.href = "{% url 'login' %}";
        } else {
            window.history.pushState(null, null, window.location.href);
        }
    };
    window.onbeforeunload = function() {
        if (!isSubmitting) {
            return "Your verification is in progress. Leaving this page will cancel the process.";
        }
    };
    document.addEventListener("DOMContentLoaded", function() {
        const form = document.querySelector('form');
        if (form) {
            form.onsubmit = function() { isSubmitting = true; };
        }
    });
</script>

<h1>Verify code</h1>
<p class="lede">A 6-digit verification code has been sent to your email to complete {{ type }}.</p>

<form method="post" autocomplete="off">
    {% csrf_token %}
    <div class="form-field">
        <label for="id_otp_code">Email code</label>
        <input class="otp-input" inputmode="numeric" pattern="[0-9]{6}" name="otp_code" id="id_otp_code" maxlength="6" placeholder="123456" autocomplete="one-time-code" required autofocus>
    </div>
    <button class="primary-btn" type="submit">Verify & continue</button>
</form>

<div class="split-links">
    <a class="text-link" href="#" onclick="location.reload();">Resend code</a>
    <a class="text-link" href="{% url 'login' %}">Cancel & sign in</a>
</div>
{% endblock %}
